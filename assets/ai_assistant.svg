<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for the scene -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2327" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Robot Head Gradient -->
    <linearGradient id="head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c313a" />
      <stop offset="100%" stop-color="#111418" />
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg-grad)" rx="30" />

  <!-- Animated Container for Floating Effect -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="4s" repeatCount="indefinite" />

    <!-- Rotating Tech Rings Behind -->
    <g transform="translate(250, 240)">
      <!-- Ring 1 -->
      <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#20BEFF" stroke-width="2" stroke-dasharray="150 50 50 50" opacity="0.3" transform="rotate(15)">
        <animateTransform attributeName="transform" type="rotate" from="15" to="375" dur="15s" repeatCount="indefinite" />
      </ellipse>
      <!-- Ring 2 -->
      <ellipse cx="0" cy="0" rx="140" ry="140" fill="none" stroke="#6F42C1" stroke-width="1.5" stroke-dasharray="20 40" opacity="0.4" transform="rotate(-20)">
        <animateTransform attributeName="transform" type="rotate" from="-20" to="-380" dur="20s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- Mascot / Robot Head -->
    <g transform="translate(250, 240)">
      <!-- Main Head Shape -->
      <path d="M -90 -40 C -90 -120, 90 -120, 90 -40 L 80 60 C 75 100, -75 100, -80 60 Z" fill="url(#head-grad)" stroke="#3E4451" stroke-width="4" />
      
      <!-- Side Earpieces -->
      <rect x="-105" y="-20" width="20" height="60" rx="10" fill="#20BEFF" opacity="0.8" filter="url(#glow-cyan)" />
      <rect x="85" y="-20" width="20" height="60" rx="10" fill="#20BEFF" opacity="0.8" filter="url(#glow-cyan)" />
      
      <!-- Visor -->
      <path d="M -75 -20 C -75 -40, 75 -40, 75 -20 L 70 30 C 65 50, -65 50, -70 30 Z" fill="url(#visor-grad)" />

      <!-- Animated Scanning Eye -->
      <g filter="url(#glow-cyan)">
        <!-- Scanner Track -->
        <rect x="-50" y="-5" width="100" height="8" rx="4" fill="#111" />
        
        <!-- Moving Scanner Light -->
        <rect x="-45" y="-4" width="20" height="6" rx="3" fill="#20BEFF">
          <animate attributeName="x" values="-45; 25; -45" dur="3s" repeatCount="indefinite" />
          <animate attributeName="width" values="20; 30; 20" dur="3s" repeatCount="indefinite" />
        </rect>
      </g>
      
      <!-- Robot Mouth / Voice Indicator -->
      <g transform="translate(0, 65)">
        <rect x="-15" y="0" width="6" height="4" rx="2" fill="#20BEFF" opacity="0.6">
          <animate attributeName="height" values="4; 12; 4" dur="1s" repeatCount="indefinite" />
          <animate attributeName="y" values="0; -4; 0" dur="1s" repeatCount="indefinite" />
        </rect>
        <rect x="-5" y="-2" width="6" height="8" rx="2" fill="#20BEFF" opacity="0.9">
          <animate attributeName="height" values="8; 18; 8" dur="1.2s" repeatCount="indefinite" />
          <animate attributeName="y" values="-2; -7; -2" dur="1.2s" repeatCount="indefinite" />
        </rect>
        <rect x="5" y="0" width="6" height="6" rx="2" fill="#20BEFF" opacity="0.6">
          <animate attributeName="height" values="6; 10; 6" dur="0.9s" repeatCount="indefinite" />
          <animate attributeName="y" values="0; -2; 0" dur="0.9s" repeatCount="indefinite" />
        </rect>
        <rect x="15" y="0" width="6" height="4" rx="2" fill="#20BEFF" opacity="0.4">
          <animate attributeName="height" values="4; 8; 4" dur="1.1s" repeatCount="indefinite" />
          <animate attributeName="y" values="0; -2; 0" dur="1.1s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    <!-- Floating Particles / Data -->
    <g fill="#20BEFF" filter="url(#glow-cyan)" opacity="0.6">
      <circle cx="120" cy="150" r="4">
        <animate attributeName="cy" values="150; 120; 150" dur="5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="380" cy="180" r="3">
        <animate attributeName="cy" values="180; 210; 180" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8; 0.1; 0.8" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="150" cy="350" r="5">
        <animate attributeName="cy" values="350; 320; 350" dur="6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3; 0.9; 0.3" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle cx="360" cy="330" r="4">
        <animate attributeName="cy" values="330; 360; 330" dur="4.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5; 1; 0.5" dur="3.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>
